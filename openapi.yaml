openapi: '3.0.3'
info:
  title: LinkSnap API
  version: 1.1.0
  description: |
    Сервис для сокращения длинных ссылок.
    Позволяет создавать короткие ссылки, отслеживать количество переходов и управлять алиасами.
servers: 
  - url: https://api.linksnap.example.com/v1
    description: Example server
paths:
  /shorten:
    post:
      summary: Создать короткую ссылку
      tags:
        - Links
      description: Принимает длинную ссылку, возвращает короткую ссылку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Длинный URL, который нужно сократить
                  example: "https://example.com/very/super/awkward/long/article"
                alias:
                  type: string
                  description: Пользовательский короткий адрес (необязательно)
                  example: "my-article"
      responses:
        '201':
          description: Ссылку успешно создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  short_url:
                    type: string
                    description: Сокращенный URL
                    example: "https://linksnap.example.com/ar123"
                  alias:
                    type: string
                    description: Короткий идентификатор
                    example: "ar123"
        '400':
          description: Неверный формат URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Алиас уже занят
  /{alias}:
    get:
      summary: Перейти по короткой ссылке
      tags:
        - Links
      description: Выполняет редирект на оригинальный UTL
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
          description: Короткий идентификатор ссылки
      responses:
        '302':
          description: Редирект на оригинальный URL
          headers:
            Location:
              schema:
                type: string
              description: Оригинальный URL
        '404':
          description: Короткая ссылка не найдена или истекла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Текст ошибки
      required:
        - error

                

              
